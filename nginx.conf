server {
    listen 80;

    gzip on;
    gzip_types text/html text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
    gzip_comp_level 6;

    add_header Cache-Control "public, max-age=3600";

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
