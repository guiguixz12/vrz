document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: repeating-linear-gradient(135deg, #2A2F35 0 2px, transparent 2px 11px); display: flex; align-items: center; justify-content: center;\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px;\">\n          <div style=\"width: 74px; height: 74px; border-radius: 50%; border: 2px solid #F0912F; display: flex; align-items: center; justify-content: center;\">\n            <div style=\"width: 0; height: 0; border-left: 22px solid #F0912F; border-top: 14px solid transparent; border-bottom: 14px solid transparent; margin-left: 6px;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #767C82;\">vídeo del proceso, 16:9 · vertical también funciona<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section style=\"border-top: 1px solid #262B30; padding: clamp(48px, 9vw, 72px) clamp(18px, 5vw, 28px); background: #0F1216;\">\n    <div style=\"max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(26px, 4.6vw, 36px);\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <div style=\"font-family: 'Archivo Black', sans-serif; font-size: 12px; letter-spacing: 0.02em; color: #F0912F;\">06<\u002Fdiv>\n          <div style=\"width: 26px; height: 2px; background: #2E343A;\"><\u002Fdiv>\n          <div style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: #8B9198; padding-left: 0.24em;\">Dudas<\u002Fdiv>\n        <\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(26px, 5vw, 36px); line-height: 1.08; letter-spacing: -0.015em; text-wrap: balance;\">Lo que me preguntan siempre<\u002Fh2>\n        <p style=\"margin: 0; font-size: clamp(15px, 2vw, 17px); line-height: 1.55; color: #8B9198; max-width: 560px; text-wrap: pretty;\">Si tu duda no está aquí, mándamela por WhatsApp.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <details style=\"border-top: 1px solid #262B30;\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 60px; padding: clamp(16px, 3.2vw, 20px) 0;\">\n            <span style=\"font-family: 'Barlow Condensed', sans-serif; font-size: clamp(19px, 3.2vw, 22px); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #FCFCFB; padding-left: 0.04em;\">¿Hay que desmontar el faro?<\u002Fspan>\n            <span class=\"faq-plus\" style=\"font-family: 'Barlow', sans-serif; font-size: 26px; line-height: 1; color: #3A9BF0; flex: none; transition: transform 0.18s ease;\">+<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding: 0 0 clamp(16px, 3.2vw, 20px); font-size: 17px; line-height: 1.55; color: #9AA0A6; max-width: 640px;\">No. Se trabaja con el faro puesto en el coche, protegiendo la pintura y las gomas de alrededor.<\u002Fdiv>\n        <\u002Fdetails>\n        <details style=\"border-top: 1px solid #262B30;\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 60px; padding: clamp(16px, 3.2vw, 20px) 0;\">\n            <span style=\"font-family: 'Barlow Condensed', sans-serif; font-size: clamp(19px, 3.2vw, 22px); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #FCFCFB; padding-left: 0.04em;\">¿Se vuelven a poner amarillos?<\u002Fspan>\n            <span class=\"faq-plus\" style=\"font-family: 'Barlow', sans-serif; font-size: 26px; line-height: 1; color: #3A9BF0; flex: none; transition: transform 0.18s ease;\">+<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding: 0 0 clamp(16px, 3.2vw, 20px); font-size: 17px; line-height: 1.55; color: #9AA0A6; max-width: 640px;\">El sol acaba atacando cualquier faro. Por eso sello con una capa UV al terminar: aguanta mucho más que un pulido a secas. Cuánto dura depende de si el coche duerme al sol o bajo techo.<\u002Fdiv>\n        <\u002Fdetails>\n        <details style=\"border-top: 1px solid #262B30;\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 60px; padding: clamp(16px, 3.2vw, 20px) 0;\">\n            <span style=\"font-family: 'Barlow Condensed', sans-serif; font-size: clamp(19px, 3.2vw, 22px); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #FCFCFB; padding-left: 0.04em;\">Mi faro está empañado por dentro<\u002Fspan>\n            <span class=\"faq-plus\" style=\"font-family: 'Barlow', sans-serif; font-size: 26px; line-height: 1; color: #3A9BF0; flex: none; transition: transform 0.18s ease;\">+<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding: 0 0 clamp(16px, 3.2vw, 20px); font-size: 17px; line-height: 1.55; color: #9AA0A6; max-width: 640px;\">Eso no se arregla desde fuera. Si el daño o la humedad están en el interior, te lo digo con la foto y no te cobro un trabajo que no va a servir.<\u002Fdiv>\n        <\u002Fdetails>\n        <details style=\"border-top: 1px solid #262B30;\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 60px; padding: clamp(16px, 3.2vw, 20px) 0;\">\n            <span style=\"font-family: 'Barlow Condensed', sans-serif; font-size: clamp(19px, 3.2vw, 22px); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #FCFCFB; padding-left: 0.04em;\">¿A qué zonas te desplazas?<\u002Fspan>\n            <span class=\"faq-plus\" style=\"font-family: 'Barlow', sans-serif; font-size: 26px; line-height: 1; color: #3A9BF0; flex: none; transition: transform 0.18s ease;\">+<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding: 0 0 clamp(16px, 3.2vw, 20px); font-size: 17px; line-height: 1.55; color: #9AA0A6; max-width: 640px;\">Valencia ciudad y área metropolitana. Si estás algo más lejos, pregúntame y te digo si llego.<\u002Fdiv>\n        <\u002Fdetails>\n        <details style=\"border-top: 1px solid #262B30; border-bottom: 1px solid #262B30;\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 60px; padding: clamp(16px, 3.2vw, 20px) 0;\">\n            <span style=\"font-family: 'Barlow Condensed', sans-serif; font-size: clamp(19px, 3.2vw, 22px); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #FCFCFB; padding-left: 0.04em;\">¿Cómo se paga?<\u002Fspan>\n            <span class=\"faq-plus\" style=\"font-family: 'Barlow', sans-serif; font-size: 26px; line-height: 1; color: #3A9BF0; flex: none; transition: transform 0.18s ease;\">+<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding: 0 0 clamp(16px, 3.2vw, 20px); font-size: 17px; line-height: 1.55; color: #9AA0A6; max-width: 640px;\">Al terminar, cuando ya has visto el resultado. Efectivo o transferencia.<\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contacto\" style=\"border-top: 1px solid #262B30; padding: clamp(56px, 10vw, 84px) clamp(18px, 5vw, 28px);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(24px, 4.6vw, 44px); align-items: center;\">\n      <div style=\"display: flex; flex-direction: column; gap: clamp(16px, 3.2vw, 22px);\">\n        <h2 style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(29px, 5.6vw, 44px); line-height: 1.04; letter-spacing: -0.02em; text-wrap: balance;\">Hazle una foto al faro y mándamela.<\u002Fh2>\n        <p style=\"margin: 0; font-size: clamp(16px, 2.2vw, 18px); line-height: 1.55; color: #A8AEB4; max-width: 480px; text-wrap: pretty;\">No necesito el modelo, ni la matrícula, ni nada más. Con la foto te digo el precio y cuándo puedo pasar.<\u002Fp>\n        <a href=\"#contacto\" style=\"display: inline-flex; align-self: flex-start; align-items: center; gap: 12px; background: #F0912F; color: #15181C; border-radius: 5px; padding: 18px 28px; font-family: 'Barlow Condensed', sans-serif; font-size: clamp(17px, 2.5vw, 20px); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding-left: calc(28px + 0.1em);\" style-hover=\"background: #FFA648;\">Abrir WhatsApp<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background: #1A1E23; border-radius: 8px; padding: clamp(24px, 4.6vw, 32px) clamp(22px, 4.4vw, 30px); display: flex; flex-direction: column; gap: 18px;\">\n        <div style=\"display: flex; align-items: center; gap: 16px;\">\n          <div style=\"width: 54px; height: 54px; flex: none; border-radius: 50%; background: #15181C; display: flex; align-items: center; justify-content: center;\">\n            <div style=\"font-family: 'Archivo Black', sans-serif; font-size: 26px; line-height: 1; color: #FCFCFB;\">V<\u002Fdiv>\n            <div style=\"width: 4px; height: 27px; margin-left: 3px; background: #F0912F; clip-path: polygon(40% 0, 100% 0, 60% 100%, 0 100%);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n            <div style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #FCFCFB; padding-left: 0.1em;\">VRZ Detallado Automotriz<\u002Fdiv>\n            <div style=\"font-size: 14px; color: #8B9198;\">Estilo &amp; Protección<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #C4C9CD;\">\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #767C82; width: 78px; flex: none;\">whatsapp<\u002Fspan>+34 000 000 000<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #767C82; width: 78px; flex: none;\">instagram<\u002Fspan>@usuario<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #767C82; width: 78px; flex: none;\">zona<\u002Fspan>Valencia y área metropolitana<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #767C82; width: 78px; flex: none;\">horario<\u002Fspan>Lunes a sábado<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #767C82; border-top: 1px solid #262B30; padding-top: 16px;\">datos genéricos: pásame el número real y el usuario de Instagram y los cambio<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top: 1px solid #262B30; padding: clamp(26px, 5vw, 34px) clamp(18px, 5vw, 28px) 0; max-width: 1180px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;\">\n    <div style=\"display: flex; align-items: center; gap: 16px;\">\n      <div style=\"display: flex; align-items: stretch;\">\n        <div style=\"font-family: 'Archivo Black', sans-serif; font-size: 24px; line-height: 0.8; letter-spacing: -0.025em; color: #FCFCFB;\">VR<\u002Fdiv>\n        <div style=\"font-family: 'Archivo Black', sans-serif; font-size: 24px; line-height: 0.8; letter-spacing: -0.025em; color: #F0912F;\">Z<\u002Fdiv>\n        <div style=\"width: 4px; flex: none; margin-left: 3px; background: #F0912F; clip-path: polygon(40% 0, 100% 0, 60% 100%, 0 100%);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #767C82; padding-left: 0.2em;\">Restauración de faros · Valencia<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 14px; color: #767C82;\">Estilo &amp; Protección<\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ sticky }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #1A1E23; border-top: 1px solid #2E343A; padding: 12px clamp(14px, 4vw, 22px) calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: nowrap; box-shadow: 0 -14px 34px rgba(0,0,0,0.45);\">\n      <div style=\"display: flex; align-items: center; gap: 14px;\">\n        <div style=\"display: flex; align-items: stretch;\">\n          <div style=\"font-family: 'Archivo Black', sans-serif; font-size: 19px; line-height: 0.8; letter-spacing: -0.025em; color: #FCFCFB;\">VRZ<\u002Fdiv>\n          <div style=\"width: 3px; flex: none; margin-left: 3px; background: #F0912F; clip-path: polygon(40% 0, 100% 0, 60% 100%, 0 100%);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: 'Barlow Condensed', sans-serif; font-size: clamp(11px, 2.9vw, 14px); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #C4C9CD; padding-left: 0.12em; line-height: 1.25;\">Faros desde 49 €<br>los dos<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"#contacto\" style=\"font-family: 'Barlow Condensed', sans-serif; font-size: clamp(13px, 3.2vw, 16px); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; background: #F0912F; color: #15181C; border-radius: 4px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 clamp(14px, 4vw, 22px); padding-left: calc(clamp(14px, 4vw, 22px) + 0.12em); white-space: nowrap; flex: none;\" style-hover=\"background: #FFA648;\">Mándame la foto<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;intro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Animación&quot;},&quot;mostrarPrecio&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Secciones&quot;},&quot;mostrarVideo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Secciones&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    reveal: 52,\n    intro: true,\n    sticky: false,\n    gal: ['antes', 'antes'],\n    faros: 2,\n    estado: 1,\n  };\n\n  _buildPixels() {\n    const w = typeof window !== 'undefined' ? window.innerWidth : 1200;\n    const S = w < 560 ? 16 : 25;\n    if (this._pixels && this._S === S) return this._pixels;\n    this._S = S;\n    const P = [];\n    for (let r = 0; r <= 10; r++) {\n      const L = Math.floor(r / 2);\n      const cols = new Set([L, L + 1, 9 - L, 10 - L]);\n      cols.forEach(c => {\n        if (c >= 0 && c <= 10) P.push({ c, r, col: '#FCFCFB' });\n      });\n      const s = 11 + Math.round((10 - r) * 0.3);\n      P.push({ c: s, r, col: '#F0912F' });\n      P.push({ c: s + 1, r, col: '#F0912F' });\n    }\n    this._pixels = P.map(p => ({\n      x: p.c * S + 'px',\n      y: p.r * S + 'px',\n      c: p.col,\n      d: (p.c * 0.026 + p.r * 0.022).toFixed(3) + 's',\n    }));\n    this._gridW = (16 * S) + 'px';\n    this._gridH = (11 * S) + 'px';\n    this._pxSize = (S - 3) + 'px';\n    return this._pixels;\n  }\n\n  _startReveal(delay) {\n    const root = document.getElementById('lp-root');\n    if (!root) return;\n    const targets = Array.from(root.children).filter(\n      el => el.tagName === 'SECTION' || el.tagName === 'FOOTER' || el.tagName === 'HEADER'\n    );\n    const ease = 'cubic-bezier(0.2, 0.8, 0.2, 1)';\n    targets.forEach(el => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(30px)';\n      el.style.transition = `opacity 0.75s ${ease}, transform 0.75s ${ease}`;\n      el.style.willChange = 'opacity, transform';\n    });\n    const show = el => {\n      el.style.opacity = '1';\n      el.style.transform = 'translateY(0)';\n    };\n    setTimeout(() => {\n      if (!('IntersectionObserver' in window)) { targets.forEach(show); return; }\n      const io = new IntersectionObserver(entries => {\n        entries.forEach(en => {\n          if (en.isIntersecting) { show(en.target); io.unobserve(en.target); }\n        });\n      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.06 });\n      targets.forEach(el => io.observe(el));\n      this._io = io;\n    }, delay);\n  }\n\n  componentDidMount() {\n    const intro = this.props.intro ?? true;\n    this._startReveal(intro ? 2250 : 60);\n    if (intro) {\n      this._introTimer = setTimeout(() => this.setState({ intro: false }), 3000);\n    }\n    this._onScroll = () => {\n      const y = window.scrollY || document.documentElement.scrollTop || 0;\n      const past = y > 620;\n      if (past !== this.state.sticky) this.setState({ sticky: past });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    clearTimeout(this._introTimer);\n    if (this._io) this._io.disconnect();\n  }\n\n  _setFromEvent(e) {\n    const r = e.currentTarget.getBoundingClientRect();\n    if (!r.width) return;\n    const pct = ((e.clientX - r.left) / r.width) * 100;\n    this.setState({ reveal: Math.max(2, Math.min(98, pct)) });\n  }\n\n  renderVals() {\n    const titles = [\n      ['BMW Serie 3 · faro izquierdo', 'plástico opaco, una hora de trabajo'],\n      ['Dacia · furgoneta', 'faro enmascarado antes de lijar'],\n    ];\n    const blank = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';\n    const gal = this.state.gal.map((mode, i) => ({\n      title: titles[i][0],\n      note: titles[i][1],\n      imgA: ['fotos/faro-antes.png', 'fotos/furgo-antes.png'][i] || blank,\n      imgB: ['fotos/faro-despues.png', 'fotos/furgo-despues.png'][i] || blank,\n      label: mode === 'antes' ? 'ANTES' : 'DESPUÉS',\n      opDespues: mode === 'antes' ? 0 : 1,\n      bgAntes: mode === 'antes' ? '#2E343A' : 'transparent',\n      colAntes: mode === 'antes' ? '#FCFCFB' : '#8B9198',\n      bgDespues: mode === 'antes' ? 'transparent' : '#F0912F',\n      colDespues: mode === 'antes' ? '#8B9198' : '#15181C',\n      setAntes: () => this.setState(s => {\n        const g = s.gal.slice(); g[i] = 'antes'; return { gal: g };\n      }),\n      setDespues: () => this.setState(s => {\n        const g = s.gal.slice(); g[i] = 'despues'; return { gal: g };\n      }),\n    }));\n\n    const base = this.state.faros === 2 ? 49 : 35;\n    const extra = [0, 10, 20][this.state.estado];\n    const act = (on) => (on ? '#F0912F' : 'transparent');\n    const actC = (on) => (on ? '#15181C' : '#C4C9CD');\n\n    const pixels = this._buildPixels();\n\n    return {\n      mostrarPrecio: this.props.mostrarPrecio ?? true,\n      mostrarVideo: this.props.mostrarVideo ?? true,\n      intro: (this.props.intro ?? true) && this.state.intro,\n      pixels,\n      gridW: this._gridW,\n      gridH: this._gridH,\n      pxSize: this._pxSize,\n      sticky: this.state.sticky,\n      revealClip: `inset(0 0 0 ${this.state.reveal}%)`,\n      revealLeft: `${this.state.reveal}%`,\n      onDown: (e) => { this._drag = true; e.currentTarget.setPointerCapture?.(e.pointerId); this._setFromEvent(e); },\n      onMove: (e) => { if (this._drag) this._setFromEvent(e); },\n      onUp: () => { this._drag = false; },\n      gal,\n      precio: `${base + extra} €`,\n      bgFaros1: act(this.state.faros === 1), colFaros1: actC(this.state.faros === 1),\n      bgFaros2: act(this.state.faros === 2), colFaros2: actC(this.state.faros === 2),\n      bgEst0: act(this.state.estado === 0), colEst0: actC(this.state.estado === 0),\n      bgEst1: act(this.state.estado === 1), colEst1: actC(this.state.estado === 1),\n      bgEst2: act(this.state.estado === 2), colEst2: actC(this.state.estado === 2),\n      setFaros1: () => this.setState({ faros: 1 }),\n      setFaros2: () => this.setState({ faros: 2 }),\n      setEst0: () => this.setState({ estado: 0 }),\n      setEst1: () => this.setState({ estado: 1 }),\n      setEst2: () => this.setState({ estado: 2 }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
